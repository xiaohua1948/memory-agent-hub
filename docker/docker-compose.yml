# =============================================================
# Memory Agent Hub - Docker 编排文件
# 使用: cd docker && docker compose up -d
# =============================================================
name: memory-agent-hub

services:
  # ---------------- MySQL ----------------
  mysql:
    image: mysql:8.0
    container_name: memory-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ${DATA_DIR}/mysql:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=1024M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ---------------- Redis ----------------
  redis:
    image: redis:7.2-alpine
    container_name: memory-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ${DATA_DIR}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- MinIO ----------------
  minio:
    image: minio/minio:latest
    container_name: memory-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - ${DATA_DIR}/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------- 后端 ----------------
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: memory-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      # MySQL（容器内 DNS）
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Redis（容器内 DNS）
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # MinIO 连接：后端容器内通过 Docker DNS(minio:9000) 访问 MinIO 服务
      MINIO_URL: http://minio:9000
      # MinIO 公开地址：用于生成预签名 URL 的 host，必须与浏览器访问 MinIO 的 host 一致，
      # 否则签名校验失败(SignatureDoesNotMatch)。本地浏览器走 127.0.0.1:9002（docker 已映射），
      # 线上部署改为公网域名(如 https://minio.your-domain.com)。
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: pictures
      # OpenCV（Linux 下自动扫描 /usr/lib/jni/libopencv_java*.so）
      OPENCV_LINUX_DLL_PATH: ""
      TZ: Asia/Shanghai
    # 确保容器内可解析 host.docker.internal（指向宿主）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT}:8088"

  # ---------------- 用户前端 ----------------
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_BASE_URL: ${FRONTEND_API_URL}
    container_name: memory-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"

  # ---------------- 管理后台前端 ----------------
  admin:
    build:
      context: ..
      dockerfile: docker/admin/Dockerfile
      args:
        VUE_APP_BASE_API: ${ADMIN_API_URL}
    container_name: memory-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${ADMIN_PORT}:80"
