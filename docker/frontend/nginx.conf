server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 后端 API 代理（生产环境前端请求 /mockApi，开发模式 /devApi）
    # 使用 Docker 内置 DNS 动态解析 backend，容器重建/重启后不再出现 502
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /devApi/ {
        set $backend_upstream http://backend:8088;
        rewrite ^/devApi/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 10000m;
    }

    location /mockApi/ {
        set $backend_upstream http://backend:8088;
        rewrite ^/mockApi/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 10000m;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 禁用缓存，避免发布新版后浏览器仍加载旧 index.html
    # 引用过期 hash 的 assets 文件导致 "Failed to fetch dynamically imported module"
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
