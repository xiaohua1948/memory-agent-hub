server:
  port: 8088
spring:
  servlet:
    multipart:
      max-file-size: 10000MB
      max-request-size: 10000MB
      enabled: true
  application:
    name: memory-backend
  #mysql配置
  datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:memory_space}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:your_mysql_password}
  #redis配置
  data:
      redis:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}
        password: ${REDIS_PASSWORD:your_redis_password}
        database: ${REDIS_DB:0}
  #邮箱配置
  mail:
      host: smtp.qq.com
      port: 465
      username: ${MAIL_USERNAME:your_qq_email@qq.com}
      password: ${MAIL_AUTH_CODE:your_qq_email_auth_code}
      default-encoding: utf-8
      protocol: smtps
      code:
        time: 300
#mybatis-plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    #打印sql日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      #id自增类型配置
      id-type: ASSIGN_ID
      #逻辑删除字段配置
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
    #控制台mybatis-plus标记
    banner: false
  mapper-locations: classpath:/mapper/*.xml
#sa-token配置
sa-token:
    # token 名称（同时也是 cookie 名称）
    token-name: Authorization
    # token 有效期（单位：秒） 默认30天，-1 代表永久有效
    timeout: 2592000
    # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
    active-timeout: -1
    # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
    is-concurrent: false
    # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
    is-share: true
    # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
    token-style: uuid
    # 是否输出操作日志
    is-log: true
    # 使用redis存取
    is-read-cookie: false
    jwt-secret-key: ${SA_TOKEN_JWT_SECRET:your_sa_token_jwt_secret}
#minio oss配置
minio:
  access-key: ${MINIO_ACCESS_KEY:your_minio_access_key}
  secret-key: ${MINIO_SECRET_KEY:your_minio_secret_key}
  url: ${MINIO_URL:http://127.0.0.1:9000}
  bucket-name: ${MINIO_BUCKET:your_minio_bucket_name}
#阿里OSS配置
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-your-region.aliyuncs.com}  # 根据实际地域修改
    accessKeyId: ${ALIYUN_OSS_ACCESS_KEY:your_aliyun_access_key_id}       # 替换为真实值
    accessKeySecret: ${ALIYUN_OSS_SECRET_KEY:your_aliyun_access_key_secret} # 替换为真实值
    bucketName: ${ALIYUN_OSS_BUCKET:your_aliyun_bucket_name}           # 存储桶名称
springdoc:
    api-docs:
      enabled: true # 开启OpenApi接口
    swagger-ui:
      path: /swagger-ui.html
      enabled: true # 开启swagger界面，依赖OpenApi，需要OpenApi同时开启
# 高德API_KEY
amp:
  api:
    key: ${AMAP_API_KEY:your_amap_api_key}
  geo:
    url: https://restapi.amap.com/v3/geocode/regeo

#opencv训练的数据模型
opencv:
  native:
    dll-path: "opencv/lib/x64/opencv_java455.dll"
    haar-model: "opencv/haarcascades/haarcascade_frontalface_alt2.xml" # Windows 路径
    # linux-dll-path: "classpath:opencv/lib/linux-x64/libopencv_java455.so" # Linux 路径

# 华为云图像识别配置
huawei:
  cloud:
    image:
      ak: ${HUAWEI_CLOUD_AK:your_huawei_cloud_ak}  # 从环境变量或配置中心读取
      sk: ${HUAWEI_CLOUD_SK:your_huawei_cloud_sk}
      region: ${HUAWEI_CLOUD_REGION:cn-north-4}  # 服务区域
      endpoint: ${HUAWEI_CLOUD_IMAGE_ENDPOINT:image.cn-north-4.myhuaweicloud.com}
      threshold: 10  # 置信度阈值
      language: zh  # 返回语言